name: CI

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: 3.50 needs Gradle 9.3.1+, the project is on 8.14 (android/gradle/wrapper).
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run lint (dart analyze)
        run: dart analyze lib test

      - name: Run tests
        run: flutter test
