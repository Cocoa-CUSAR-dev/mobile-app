name: CI

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run lint (dart analyze)
        run: dart analyze lib test

      - name: Run tests
        # Tests need an absolute hub URL (lib/config/hub_config.dart); any host works,
        # every request is answered by a MockClient.
        run: flutter test --dart-define=HUB_BASE_URL=https://hub.test
