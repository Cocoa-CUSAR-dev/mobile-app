name: CI

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to an exact version: '3.x' once picked up a release that broke the build overnight (docs-and-plan#325).
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run lint (dart analyze)
        run: dart analyze lib test

      - name: Run tests
        run: flutter test
