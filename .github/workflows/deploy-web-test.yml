# Deploys the Flutter WEB build (not the real Android/iOS app) to GitHub Pages,
# on pushes to `test` only. This is for testing the dynamic/networked parts of
# the app in a browser -- it does not validate offline behavior, GPS accuracy,
# or performance on real farmer hardware. See the team's docs for that context.

name: Deploy web build to GitHub Pages (test)

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Note: pubspec.yaml's `sdk: ^3.9.2` is the DART SDK constraint, not a
      # Flutter release number -- Flutter and Dart version independently.
      # Using the stable channel avoids having to track the matching Flutter
      # version by hand.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # --base-href must match the repo name for a GitHub Pages *project* site
      # (served at https://<org>.github.io/mobile-app/). Change if that changes.
      # --dart-define overrides service_provider.dart's baseUrl for this build
      # only -- the native app's default (LAN IP) is untouched.
      # API_BASE_URL comes from a repo secret (Settings > Secrets and
      # variables > Actions > New repository secret, name API_BASE_URL) so
      # the backend URL can change without editing this file. No trailing
      # slash in the secret's value -- service_provider.dart concatenates it
      # directly with endpoints that already start with "/".
      - name: Build web
        run: |
          flutter build web \
            --base-href /mobile-app/ \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
