name: CD - Deploy

on:
  push:
    branches: '**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run lint (dart analyze)
        run: dart analyze lib test

      - name: Run tests
        # Tests need an absolute hub URL (lib/config/hub_config.dart); any host works,
        # every request is answered by a MockClient.
        run: flutter test --dart-define=HUB_BASE_URL=https://hub.test

  build-android:
    needs: deploy-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=HUB_BASE_URL=${{ secrets.HUB_BASE_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/apk/release/

  build-ios:
    needs: deploy-check
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign --dart-define=HUB_BASE_URL=${{ secrets.HUB_BASE_URL }}

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/
