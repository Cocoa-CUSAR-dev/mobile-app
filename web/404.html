<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages เสิร์ฟไฟล์นี้ให้ทุก path ที่ไม่มีไฟล์จริงตรงกัน (เช่น
      // /mobile-app/liff-link) — เข้ารหัส path เดิมไว้ใน query string แล้ว
      // redirect กลับไปที่ index.html (root ของ project page) ให้ Flutter
      // router มาอ่านค่าต่อเอง (ดูสคริปต์คู่กันใน web/index.html)
      //
      // pathSegmentsToKeep = 1 เพราะ --base-href คือ /mobile-app/ (1 segment)
      // ถ้า repo name หรือ --base-href เปลี่ยน ต้องแก้เลขนี้ให้ตรงด้วย
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
