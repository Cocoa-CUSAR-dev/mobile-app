<!DOCTYPE html>
<html>
<head>
  <style>
    /* html/body ไม่มีความสูงมาก่อนหน้านี้ — document.body.clientHeight วัดได้ 0
       จริง (ยืนยันจาก debug overlay: "body=964x0" ใน LINE in-app webview)
       ทำให้ Flutter engine คำนวณ physicalSize/viewInsets เริ่มต้นผิดตั้งแต่แรก
       จน assert "ViewInsets cannot be negative" แล้วล้มการวาดทั้งหมด (จอขาว) */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
  <script type="text/javascript">
    // TEMP DEBUG OVERLAY — ลบทิ้งทันทีที่หา error เจอแล้ว ไม่ควรค้างไว้ถาวร
    // โชว์ error/console.error เป็นกล่อง log ติดขอบล่างจอ ไว้ debug บนมือถือ
    // จริง (ผ่าน LINE in-app webview) โดยไม่ต้องต่อ USB/เปิด DevTools
    (function () {
      var box = document.createElement('div');
      box.id = '__debug_log';
      box.style.cssText =
        'position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow:auto;' +
        'background:rgba(0,0,0,0.88);color:#7CFC00;font:11px monospace;' +
        'padding:8px;z-index:999999;white-space:pre-wrap;word-break:break-all;';
      document.addEventListener('DOMContentLoaded', function () {
        document.body.appendChild(box);
      });
      function log(msg) {
        var line = document.createElement('div');
        line.textContent = msg;
        box.appendChild(line);
      }
      window.addEventListener('error', function (e) {
        log('[error] ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        log('[unhandledrejection] ' + e.reason);
      });
      var origError = console.error;
      console.error = function () {
        log('[console.error] ' + Array.prototype.slice.call(arguments).join(' '));
        origError.apply(console, arguments);
      };
      var origWarn = console.warn;
      console.warn = function () {
        log('[console.warn] ' + Array.prototype.slice.call(arguments).join(' '));
        origWarn.apply(console, arguments);
      };
      var origLog = console.log;
      console.log = function () {
        log('[console.log] ' + Array.prototype.slice.call(arguments).join(' '));
        origLog.apply(console, arguments);
      };
      window.__debugLog = log; // ให้สคริปต์อื่นข้างล่างเรียก log เดียวกันได้
      log('[debug overlay] loaded, waiting for errors...');
      log('[ua] ' + navigator.userAgent);
      log('[url@start] ' + window.location.href);

      // เช็คจุดที่ hang ได้บ่อยที่สุด 2 จุด: LIFF SDK โหลดสำเร็จไหม, Flutter render frame แรกไหม
      // สำคัญ: Flutter dispatch event นี้บน window ไม่ใช่ document (event ที่
      // dispatch บน window ไม่ไหลลงมาถึง document listener) — ฟังทั้งคู่กันพลาด
      var firstFrameSeen = false;
      function onFirstFrame() {
        firstFrameSeen = true;
        log('[flutter] first frame rendered ✅');
      }
      window.addEventListener('flutter-first-frame', onFirstFrame);
      document.addEventListener('flutter-first-frame', onFirstFrame);

      // probe WebGL — CanvasKit (renderer ของ Flutter web) ต้องมี WebGL ถึงจะวาดได้
      // in-app webview บางตัวปิด hardware acceleration ทำให้ WebGL หายไปทั้งที่
      // Chromium เวอร์ชันใหม่ → อาการคือ Dart รันปกติแต่จอขาวเปล่า ตรงกับที่เจอพอดี
      try {
        var cv = document.createElement('canvas');
        var gl2 = cv.getContext('webgl2');
        var gl1 = gl2 ? null : cv.getContext('webgl');
        log('[webgl] webgl2=' + (gl2 ? 'OK' : 'ไม่มี') + ', webgl1=' + (gl2 ? '(ไม่ได้เช็ค)' : (gl1 ? 'OK' : 'ไม่มี')));
      } catch (e) {
        log('[webgl] probe error: ' + e.message);
      }

      setTimeout(function () {
        if (firstFrameSeen) return;
        log('[flutter] first frame ยังไม่ขึ้นหลัง 8 วินาที (' +
          (typeof liff === 'undefined' ? 'liff SDK ยังไม่โหลด' : 'liff SDK โหลดแล้ว') + ')');
        log('[url@8s] ' + window.location.href);
      }, 8000);

      // เช็คขนาดจริงของ element ที่ Flutter ใช้วาด — "first frame rendered" แปลว่า
      // วาดสำเร็จ "ครั้งหนึ่ง" เท่านั้น ถ้า host element กว้าง/สูง = 0 จะยังเห็นจอ
      // ขาวได้ทั้งที่ event ยิงแล้วจริง เช็คซ้ำหลายจังหวะ (0.5s เพื่อจับตอน build
      // เสร็จใหม่ๆ, 3s เพื่อจับตอน LiffReady/ฟอร์มควรขึ้นแล้ว)
      function dumpFlutterHostSize(tag) {
        log('[size@' + tag + '] window=' + window.innerWidth + 'x' + window.innerHeight +
          ', body=' + document.body.clientWidth + 'x' + document.body.clientHeight);
        var hosts = document.querySelectorAll('flutter-view, flt-glass-pane, canvas, [flt-renderer]');
        if (hosts.length === 0) {
          log('[size@' + tag + '] ไม่เจอ flutter host element เลย (flutter-view/flt-glass-pane/canvas)');
        }
        hosts.forEach(function (el, i) {
          var r = el.getBoundingClientRect();
          log('[size@' + tag + '] <' + el.tagName.toLowerCase() + '>#' + i +
            ' rect=' + Math.round(r.width) + 'x' + Math.round(r.height) +
            ' style.display=' + getComputedStyle(el).display +
            ' style.visibility=' + getComputedStyle(el).visibility);
        });
      }
      setTimeout(function () { dumpFlutterHostSize('0.5s'); }, 500);
      setTimeout(function () { dumpFlutterHostSize('3s'); }, 3000);
    })();
  </script>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    //
    // คู่กับ web/404.html — ถอดรหัส path ที่ 404.html เข้ารหัสไว้ใน query
    // string กลับมาเป็น path จริงด้วย history.replaceState ก่อนที่ Flutter
    // router จะเริ่มอ่าน URL (ต้องอยู่ก่อน flutter_bootstrap.js เสมอ)
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- ไฟล์นี้ไม่เคยมี viewport meta tag เลย — ปล่อยให้ browser (โดยเฉพาะ
       webview ของ LINE) กับ Flutter engine ต่างฝ่ายต่างคำนวณ viewport/inset
       เอง จนชนกันได้ "ViewInsets cannot be negative" ตอน layout เปลี่ยน
       (เช่น ฟอร์มที่มี TextField โผล่ขึ้นมา) interactive-widget=resizes-content
       บอก browser ให้ resize เนื้อหาแทนการ resize visual viewport เอง ให้
       Flutter เป็นฝ่ายเดียวที่จัดการ inset -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cocoa_supply">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cocoa_supply</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    if (window.__debugLog) window.__debugLog('[boot] flutter_bootstrap.js กำลังจะเริ่มโหลด...');
  </script>
  <script src="flutter_bootstrap.js" async
    onload="window.__debugLog && window.__debugLog('[boot] flutter_bootstrap.js โหลดสำเร็จ (แค่โหลดไฟล์ ยังไม่แปลว่า Flutter render เสร็จ)')"
    onerror="window.__debugLog && window.__debugLog('[boot] flutter_bootstrap.js โหลด FAIL')"
  ></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    onload="window.__debugLog && window.__debugLog('[liff] LIFF SDK โหลดสำเร็จ')"
    onerror="window.__debugLog && window.__debugLog('[liff] LIFF SDK โหลด FAIL')"
  ></script>
</body>
</html>
