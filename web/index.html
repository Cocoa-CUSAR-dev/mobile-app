<!DOCTYPE html>
<html>
<head>
  <style>
    /* ไม่มี style นี้มาก่อน → document.body.clientHeight วัดได้ 0 จริงในบาง
       LINE in-app webview (ยืนยันจาก debug log ตอนดีบัก: "body=964x0") ทำให้
       Flutter engine คำนวณ physicalSize/viewInsets เริ่มต้นผิด จน assert
       "ViewInsets cannot be negative" แล้วล้มการวาดทั้งหมด (จอขาว/โหลดไม่ขึ้น)
       เกิดเฉพาะบาง webview engine เท่านั้น จึงอธิบายได้ว่าทำไมบางคนเปิดได้ปกติ
       บางคนไม่ได้เลย */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    //
    // คู่กับ web/404.html — ถอดรหัส path ที่ 404.html เข้ารหัสไว้ใน query
    // string กลับมาเป็น path จริงด้วย history.replaceState ก่อนที่ Flutter
    // router จะเริ่มอ่าน URL (ต้องอยู่ก่อน flutter_bootstrap.js เสมอ)
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cocoa_supply">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cocoa_supply</title>
  <link rel="manifest" href="manifest.json">

  <!--
    maplibre_gl's web implementation (see lib/widgets/components/gis_input.dart)
    calls into a global `maplibregl` JS object that only exists once these are
    loaded -- without them, MapLibreMapController.initPlatform() throws
    immediately ("Cannot read properties of undefined (reading 'LngLat')") and
    every map screen renders as a blank white area.

    Three deliberate departures from the snippet in maplibre_gl 0.25.0's
    README, which is written for a demo rather than for this app:

    1. Exact version, not the README's "@^4.3". That is a semver range, and
       unpkg resolves it per request with a 60-second cache -- it already
       serves 4.7.1, and any of the 11 matching releases could start running
       in production without anyone deploying. pubspec.lock pins the Dart
       half of this dependency down to a sha256; the JS half should not be
       free to move on its own.

    2. `defer`, because flutter_bootstrap.js sits further down in <body>: a
       render-blocking 803 KB script here delays the whole app, not just the
       map, and this is opened over mobile data inside the LINE webview.
       Safe because the map only ever mounts on the register screens
       (GisInput), never on the initial route -- deferred scripts finish
       before DOMContentLoaded, long before anyone navigates there.

    3. Subresource Integrity, since this runs on the same origin as the
       farmer's JWT. Only possible because of (1): a floating version has no
       stable hash. To regenerate after a version bump, pipe the file
       through: openssl dgst -sha384 -binary | openssl base64 -A
  -->
  <script defer
          src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
          integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj"
          crossorigin="anonymous"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
        rel="stylesheet"
        integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V"
        crossorigin="anonymous" />
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</body>
</html>
