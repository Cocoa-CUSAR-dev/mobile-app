<!DOCTYPE html>
<html>
<head>
  <style>
    /* ไม่มี style นี้มาก่อน → document.body.clientHeight วัดได้ 0 จริงในบาง
       LINE in-app webview (ยืนยันจาก debug log ตอนดีบัก: "body=964x0") ทำให้
       Flutter engine คำนวณ physicalSize/viewInsets เริ่มต้นผิด จน assert
       "ViewInsets cannot be negative" แล้วล้มการวาดทั้งหมด (จอขาว/โหลดไม่ขึ้น)
       เกิดเฉพาะบาง webview engine เท่านั้น จึงอธิบายได้ว่าทำไมบางคนเปิดได้ปกติ
       บางคนไม่ได้เลย */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    //
    // คู่กับ web/404.html — ถอดรหัส path ที่ 404.html เข้ารหัสไว้ใน query
    // string กลับมาเป็น path จริงด้วย history.replaceState ก่อนที่ Flutter
    // router จะเริ่มอ่าน URL (ต้องอยู่ก่อน flutter_bootstrap.js เสมอ)
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cocoa_supply">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cocoa_supply</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</body>
</html>
